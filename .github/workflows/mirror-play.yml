name: Mirror published Google Play APKs
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
concurrency:
  group: mirror-play
permissions:
  contents: write
  id-token: write
jobs:
  mirror:
    if: github.repository_id == '1457246967' && github.ref == 'refs/heads/main' && vars.PLAY_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: google
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: squiggly-apk-downloads@squiggly-487512.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Verify and publish APKs
        env:
          PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python3 scripts/mirror-play.py
